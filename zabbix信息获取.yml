    - data:
        code: |
          import csv
          import io
          import json
          import urllib.request

          TIMEOUT = 20
          MAX_CHARS = 300000
          MAX_PARTS = 8
          HOST_FIELDS = [
              "hostid", "host", "name", "status", "primary_ip",
              "all_ips", "group_names", "template_names",
          ]
          GROUP_FIELDS = ["groupid", "name", "host_count"]


          def clean(value):
              return "" if value is None else str(value).strip()


          def csv_text(rows, fields):
              output = io.StringIO(newline="")
              writer = csv.DictWriter(output, fieldnames=fields, extrasaction="ignore")
              writer.writeheader()
              writer.writerows(rows)
              return output.getvalue()


          def split_csv_if_needed(rows, fields):
              full = csv_text(rows, fields)
              if len(full) <= MAX_CHARS:
                  return full, []

              header = csv_text([], fields)
              parts = []
              current = header
              for row in rows:
                  line = csv_text([row], fields)[len(header):]
                  if len(header) + len(line) > MAX_CHARS:
                      raise ValueError("ERROR: CSV too large, increase MAX_PARTS or use plugin/tool file output")
                  if len(current) + len(line) > MAX_CHARS:
                      parts.append(current)
                      current = header
                  current += line
              parts.append(current)

              if len(parts) > MAX_PARTS:
                  raise ValueError("ERROR: CSV too large, increase MAX_PARTS or use plugin/tool file output")
              return "", parts


          def zabbix_request(url, method, params, auth=None, request_id=1):
              payload = {"jsonrpc": "2.0", "method": method, "params": params, "id": request_id}
              if auth:
                  payload["auth"] = auth
              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json-rpc"},
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=TIMEOUT) as response:
                  data = json.loads(response.read().decode("utf-8"))
              if "error" in data or "result" not in data:
                  raise RuntimeError(method)
              return data["result"]


          def login(url, user, password):
              try:
                  return zabbix_request(url, "user.login", {"username": user, "password": password})
              except Exception:
                  return zabbix_request(url, "user.login", {"user": user, "password": password}, request_id=2)


          def get_hosts(url, auth):
              base = {
                  "output": ["hostid", "host", "name", "status"],
                  "selectInterfaces": ["ip", "main"],
                  "selectParentTemplates": ["name"],
                  "sortfield": "host",
              }
              try:
                  return zabbix_request(
                      url, "host.get", dict(base, selectHostGroups=["name"]), auth, 3
                  ) or []
              except Exception:
                  return zabbix_request(
                      url, "host.get", dict(base, selectGroups=["name"]), auth, 4
                  ) or []


          def get_hostgroups(url, auth):
              return zabbix_request(
                  url,
                  "hostgroup.get",
                  {"output": ["groupid", "name"], "selectHosts": "count", "sortfield": "name"},
                  auth,
                  5,
              ) or []


          def build_host_rows(hosts):
              rows = []
              for host in hosts:
                  interfaces = host.get("interfaces") or []
                  ips = [clean(item.get("ip")) for item in interfaces if clean(item.get("ip"))]
                  main_ips = [
                      clean(item.get("ip"))
                      for item in interfaces
                      if clean(item.get("main")) == "1" and clean(item.get("ip"))
                  ]
                  groups = host.get("hostgroups") or host.get("groups") or []
                  templates = host.get("parentTemplates") or []
                  rows.append({
                      "hostid": clean(host.get("hostid")),
                      "host": clean(host.get("host")),
                      "name": clean(host.get("name")),
                      "status": clean(host.get("status")),
                      "primary_ip": main_ips[0] if main_ips else ips[0] if ips else "",
                      "all_ips": ";".join(ips),
                      "group_names": ";".join(clean(item.get("name")) for item in groups),
                      "template_names": ";".join(clean(item.get("name")) for item in templates),
                  })
              return rows


          def build_group_rows(groups):
              rows = []
              for group in groups:
                  hosts = group.get("hosts", "")
                  rows.append({
                      "groupid": clean(group.get("groupid")),
                      "name": clean(group.get("name")),
                      "host_count": len(hosts) if isinstance(hosts, list) else clean(hosts),
                  })
              return rows


          def empty_output():
              output = {
                  "result": "",
                  "zabbix_hosts_csv": "",
                  "zabbix_hostgroups_csv": "",
              }
              for name in ("zabbix_hosts_csv", "zabbix_hostgroups_csv"):
                  for index in range(1, MAX_PARTS + 1):
                      output[f"{name}_part_{index:02d}"] = ""
              return output


          def put_csv(output, name, rows, fields):
              full, parts = split_csv_if_needed(rows, fields)
              output[name] = full
              for index, part in enumerate(parts, 1):
                  output[f"{name}_part_{index:02d}"] = part


          def main(zabbix_url: str, zabbix_user: str, zabbix_password: str) -> dict:
              output = empty_output()
              url = clean(zabbix_url)
              user = clean(zabbix_user)
              password = clean(zabbix_password)
              if not url or not user or not password:
                  output["result"] = "ERROR: missing required Zabbix parameters"
                  return output
              if not url.endswith("api_jsonrpc.php"):
                  url = url.rstrip("/") + "/api_jsonrpc.php"

              try:
                  auth = login(url, user, password)
              except Exception:
                  output["result"] = "ERROR: Zabbix login failed"
                  return output
              try:
                  hosts = get_hosts(url, auth)
              except Exception:
                  output["result"] = "ERROR: host.get failed"
                  return output
              try:
                  groups = get_hostgroups(url, auth)
              except Exception:
                  output["result"] = "ERROR: hostgroup.get failed"
                  return output

              try:
                  put_csv(output, "zabbix_hosts_csv", build_host_rows(hosts), HOST_FIELDS)
                  put_csv(output, "zabbix_hostgroups_csv", build_group_rows(groups), GROUP_FIELDS)
              except ValueError as error:
                  output = empty_output()
                  output["result"] = str(error)
                  return output

              return output
        code_language: python3
        desc: 获取 Zabbix 主机和主机群组 CSV；超长时按行输出带表头分片
