    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 为每个主机群组生成简短语义说明
        model:
          completion_params:
            temperature: 0.1
          mode: chat
          name: deepseek-v4-flash
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - id: 1810000000003-system
          role: system
          text: |
            你是 Zabbix 主机群组知识整理助手。
            请根据输入 JSON 中的 group_name、host_count、host_name_samples、host_ip_samples、template_samples，为每个主机群组补充 group_semantic。
            只输出 JSON 数组，不要输出 Markdown，不要输出代码块，不要解释。
            每个元素必须只有以下字段：
            group_name,group_semantic
            group_semantic 使用中文，控制在 30 字以内，描述该群组可能代表的业务、环境、系统类型或用途。
            如果样本不足，就根据 group_name 做保守总结。
        - id: 1810000000003-user
          role: user
          text: '{{#1810000000002.group_context_json#}}'
        selected: false
        title: summarize_group_semantics
        type: llm
        vision:
          enabled: false
      height: 98
      id: '1810000000003'
      position: {x: 680, y: 280}
      positionAbsolute: {x: 680, y: 280}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        code: |
          import csv
          import io
          import json
          import re

          FIELDS = [
              "group_name", "group_semantic", "host_count",
              "host_name_samples", "host_ip_samples", "template_samples",
          ]


          def clean(value):
              return "" if value is None else str(value).strip()


          def load_json(text, default):
              text = clean(text)
              if not text:
                  return default
              text = re.sub(r"^```(?:json)?\s*", "", text)
              text = re.sub(r"\s*```$", "", text)
              try:
                  return json.loads(text)
              except Exception:
                  return default


          def join_values(values):
              if isinstance(values, list):
                  return ";".join(clean(item) for item in values if clean(item))
              return clean(values)


          def write_csv(rows):
              output = io.StringIO(newline="")
              writer = csv.DictWriter(output, fieldnames=FIELDS, extrasaction="ignore")
              writer.writeheader()
              writer.writerows(rows)
              return output.getvalue()


          def main(group_context_json: str, llm_text: str) -> dict:
              context_rows = load_json(group_context_json, [])
              semantic_rows = load_json(llm_text, [])
              semantic_by_group = {}
              if isinstance(semantic_rows, list):
                  for row in semantic_rows:
                      if isinstance(row, dict):
                          name = clean(row.get("group_name"))
                          semantic = clean(row.get("group_semantic"))
                          if name and semantic:
                              semantic_by_group[name] = semantic

              rows = []
              for item in context_rows if isinstance(context_rows, list) else []:
                  if not isinstance(item, dict):
                      continue
                  group_name = clean(item.get("group_name"))
                  if not group_name:
                      continue
                  rows.append({
                      "group_name": group_name,
                      "group_semantic": semantic_by_group.get(group_name, group_name),
                      "host_count": item.get("host_count", 0),
                      "host_name_samples": join_values(item.get("host_name_samples")),
                      "host_ip_samples": join_values(item.get("host_ip_samples")),
                      "template_samples": join_values(item.get("template_samples")),
                  })

              return {"hostgroup_knowledge_csv": write_csv(rows)}
        code_language: python3
        desc: 合并 LLM 语义并输出标准 CSV
        outputs:
          hostgroup_knowledge_csv: {children: null, type: string}
        selected: false
        title: build_knowledge_csv
        type: code
        variables:
        - value_selector: ['1810000000002', group_context_json]
          variable: group_context_json
        - value_selector: ['1810000000003', text]
          variable: llm_text
