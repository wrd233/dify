      positionAbsolute: {x: 80, y: 280}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        code: |
          import csv
          import io
          import json

          MAX_GROUPS = 160
          MAX_SAMPLES = 8
          MAX_TEMPLATE_SAMPLES = 10


          def clean(value):
              return "" if value is None else str(value).strip()


          def parse_csv(text):
              text = clean(text).lstrip("\ufeff")
              if not text:
                  return []
              reader = csv.DictReader(io.StringIO(text))
              reader.fieldnames = [clean(name) for name in (reader.fieldnames or [])]
              return [{clean(key): clean(value) for key, value in row.items() if key} for row in reader]


          def split_values(value):
              values = []
              for item in clean(value).split(";"):
                  item = clean(item)
                  if item and item not in values:
                      values.append(item)
              return values


          def add_sample(values, value, limit):
              value = clean(value)
              if value and value not in values and len(values) < limit:
                  values.append(value)


          def main(zabbix_hosts_csv: str, zabbix_hostgroups_csv: str) -> dict:
              hosts = parse_csv(zabbix_hosts_csv)
              groups = parse_csv(zabbix_hostgroups_csv)
              by_group = {}

              for group in groups:
                  name = clean(group.get("name") or group.get("group_name"))
                  if not name:
                      continue
                  by_group.setdefault(name, {
                      "group_name": name,
                      "host_count": 0,
                      "host_name_samples": [],
                      "host_ip_samples": [],
                      "template_samples": [],
                      "fallback_host_count": clean(group.get("host_count")),
                  })

              for host in hosts:
                  host_name = clean(host.get("name") or host.get("host"))
                  host_ip = clean(host.get("primary_ip"))
                  templates = split_values(host.get("template_names"))
                  for group_name in split_values(host.get("group_names")):
                      item = by_group.setdefault(group_name, {
                          "group_name": group_name,
                          "host_count": 0,
                          "host_name_samples": [],
                          "host_ip_samples": [],
                          "template_samples": [],
                          "fallback_host_count": "",
                      })
                      item["host_count"] += 1
                      add_sample(item["host_name_samples"], host_name, MAX_SAMPLES)
                      add_sample(item["host_ip_samples"], host_ip, MAX_SAMPLES)
                      for template in templates:
                          add_sample(item["template_samples"], template, MAX_TEMPLATE_SAMPLES)

              rows = []
              for item in by_group.values():
                  count = item["host_count"]
                  if not count and item["fallback_host_count"].isdigit():
                      count = int(item["fallback_host_count"])
                  rows.append({
                      "group_name": item["group_name"],
                      "host_count": count,
                      "host_name_samples": item["host_name_samples"],
                      "host_ip_samples": item["host_ip_samples"],
                      "template_samples": item["template_samples"],
                  })

              rows.sort(key=lambda row: row["group_name"])
              rows = rows[:MAX_GROUPS]
              return {
                  "group_context_json": json.dumps(rows, ensure_ascii=False, separators=(",", ":"))
              }
        code_language: python3
        desc: 解析 CSV 并按主机群组聚合主机名、IP、模板样本
        outputs:
          group_context_json: {children: null, type: string}
        selected: false
        title: aggregate_hostgroup_samples
        type: code
        variables:
        - value_selector: ['1810000000001', zabbix_hosts_csv]
          variable: zabbix_hosts_csv
        - value_selector: ['1810000000001', zabbix_hostgroups_csv]
          variable: zabbix_hostgroups_csv
      height: 98
