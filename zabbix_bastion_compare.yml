    - data:
        code: |
          import csv
          import io
          import ipaddress
          import re

          NAME_DIFF_FIELDS = [
              "ip", "bastion_name", "zabbix_name", "zabbix_host", "zabbix_hostid",
              "bastion_os_type", "bastion_protocol", "bastion_port",
              "bastion_department", "bastion_resource_tag", "zabbix_status",
              "zabbix_group_names", "zabbix_template_names",
          ]
          BASTION_ONLY_FIELDS = [
              "ip", "bastion_name", "bastion_os_type", "bastion_protocol",
              "bastion_port", "bastion_department", "bastion_resource_tag",
          ]
          ZABBIX_ONLY_FIELDS = [
              "ip", "zabbix_name", "zabbix_host", "zabbix_hostid",
              "zabbix_status", "zabbix_group_names", "zabbix_template_names",
          ]


          def clean(value):
              return "" if value is None else str(value).strip()


          def parse_csv(text):
              text = clean(text).lstrip("\ufeff")
              if not text:
                  return []
              reader = csv.DictReader(io.StringIO(text))
              reader.fieldnames = [clean(name) for name in (reader.fieldnames or [])]
              return [{clean(key): clean(value) for key, value in row.items() if key} for row in reader]


          def write_csv(rows, fields):
              output = io.StringIO(newline="")
              writer = csv.DictWriter(output, fieldnames=fields, extrasaction="ignore")
              writer.writeheader()
              writer.writerows(rows)
              return output.getvalue()


          def ips_from(row):
              values = [clean(row.get("primary_ip"))]
              values += re.split(r"[,;\s]+", clean(row.get("all_ips")))
              ips = []
              for value in values:
                  try:
                      ip = str(ipaddress.IPv4Address(value))
                      if ip not in ips:
                          ips.append(ip)
                  except Exception:
                      pass
              return ips


          def zabbix_values(ip, bastion, zabbix):
              return {
                  "ip": ip,
                  "bastion_name": bastion.get("bastion_name", ""),
                  "zabbix_name": zabbix.get("name", ""),
                  "zabbix_host": zabbix.get("host", ""),
                  "zabbix_hostid": zabbix.get("hostid", ""),
                  "bastion_os_type": bastion.get("os_type", ""),
                  "bastion_protocol": bastion.get("protocol", ""),
                  "bastion_port": bastion.get("port", ""),
                  "bastion_department": bastion.get("department", ""),
                  "bastion_resource_tag": bastion.get("resource_tag", ""),
                  "zabbix_status": zabbix.get("status", ""),
                  "zabbix_group_names": zabbix.get("group_names", ""),
                  "zabbix_template_names": zabbix.get("template_names", ""),
              }


          def main(normalized_bastion_csv: str, zabbix_hosts_csv: str, zabbix_groups_csv: str) -> dict:
              bastion_rows = parse_csv(normalized_bastion_csv)
              zabbix_rows = parse_csv(zabbix_hosts_csv)
              bastion_by_ip = {row.get("ip", ""): row for row in bastion_rows if row.get("ip")}

              # Multiple Zabbix hosts sharing an IP are handled conservatively: keep the first.
              zabbix_by_ip = {}
              for row in zabbix_rows:
                  row_ips = ips_from(row)
                  for ip in row_ips:
                      zabbix_by_ip.setdefault(ip, row)

              name_diff = []
              bastion_only = []
              for ip, bastion in bastion_by_ip.items():
                  zabbix = zabbix_by_ip.get(ip)
                  if not zabbix:
                      bastion_only.append({
                          "ip": ip,
                          "bastion_name": bastion.get("bastion_name", ""),
                          "bastion_os_type": bastion.get("os_type", ""),
                          "bastion_protocol": bastion.get("protocol", ""),
                          "bastion_port": bastion.get("port", ""),
                          "bastion_department": bastion.get("department", ""),
                          "bastion_resource_tag": bastion.get("resource_tag", ""),
                      })
                  elif clean(bastion.get("bastion_name")).casefold() != clean(zabbix.get("name")).casefold():
                      name_diff.append(zabbix_values(ip, bastion, zabbix))

              zabbix_only = []
              matched_hostids = {
                  row.get("hostid", "")
                  for ip, row in zabbix_by_ip.items()
                  if ip in bastion_by_ip
              }
              emitted_hostids = set()
              for ip, row in zabbix_by_ip.items():
                  hostid = row.get("hostid", "")
                  if hostid in matched_hostids or hostid in emitted_hostids:
                      continue
                  emitted_hostids.add(hostid)
                  zabbix_only.append({
                      "ip": ip,
                      "zabbix_name": row.get("name", ""),
                      "zabbix_host": row.get("host", ""),
                      "zabbix_hostid": row.get("hostid", ""),
                      "zabbix_status": row.get("status", ""),
                      "zabbix_group_names": row.get("group_names", ""),
                      "zabbix_template_names": row.get("template_names", ""),
                  })

              return {
                  "name_diff_csv": write_csv(name_diff, NAME_DIFF_FIELDS),
                  "bastion_only_csv": write_csv(bastion_only, BASTION_ONLY_FIELDS),
                  "zabbix_only_csv": write_csv(zabbix_only, ZABBIX_ONLY_FIELDS),
              }
        code_language: python3
        desc: 按 primary_ip 和 all_ips 对比堡垒机与 Zabbix 主机
        outputs:
          name_diff_csv: {children: null, type: string}
          bastion_only_csv: {children: null, type: string}
          zabbix_only_csv: {children: null, type: string}
        selected: false
        title: compare_bastion_with_zabbix
        type: code
        variables:
        - value_selector: ['1800000000002', normalized_bastion_csv]
          variable: normalized_bastion_csv
        - value_selector: ['1800000000001', zabbix_hosts_csv]
          variable: zabbix_hosts_csv
        - value_selector: ['1800000000001', zabbix_groups_csv]
          variable: zabbix_groups_csv
      height: 98
