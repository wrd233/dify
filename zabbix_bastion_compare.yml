    - data:
        code: |
          import csv
          import io
          import ipaddress

          FIELDS = [
              "bastion_name", "ip", "protocol", "port", "os_type",
              "department", "resource_tag",
          ]


          def clean(value):
              return "" if value is None else str(value).strip()


          def valid_ip(value):
              try:
                  return str(ipaddress.IPv4Address(clean(value)))
              except Exception:
                  return ""


          def parse_csv(text):
              text = clean(text).lstrip("\ufeff")
              if not text:
                  return []
              reader = csv.DictReader(io.StringIO(text))
              reader.fieldnames = [clean(name) for name in (reader.fieldnames or [])]
              return [{clean(key): clean(value) for key, value in row.items() if key} for row in reader]


          def write_csv(rows):
              output = io.StringIO(newline="")
              writer = csv.DictWriter(output, fieldnames=FIELDS, extrasaction="ignore")
              writer.writeheader()
              writer.writerows(rows)
              return output.getvalue()


          def merge_values(left, right):
              values = []
              for value in (left + ";" + right).split(";"):
                  value = clean(value)
                  if value and value not in values:
                      values.append(value)
              return ";".join(values)


          def main(bastion_hosts_csv: str) -> dict:
              hosts = {}
              for row in parse_csv(bastion_hosts_csv):
                  ip = valid_ip(row.get("主机/应用地址"))
                  if not ip:
                      continue
                  item = {
                      "bastion_name": clean(row.get("资源名称")),
                      "ip": ip,
                      "protocol": clean(row.get("协议")),
                      "port": clean(row.get("资源端口")),
                      "os_type": clean(row.get("系统类型")),
                      "department": clean(row.get("所属部门")),
                      "resource_tag": clean(row.get("资源标签")),
                  }
                  old = hosts.get(ip)
                  if not old:
                      hosts[ip] = item
                      continue
                  if sum(bool(value) for value in item.values()) > sum(bool(value) for value in old.values()):
                      item["protocol"] = merge_values(item["protocol"], old["protocol"])
                      item["port"] = merge_values(item["port"], old["port"])
                      hosts[ip] = item
                  else:
                      old["protocol"] = merge_values(old["protocol"], item["protocol"])
                      old["port"] = merge_values(old["port"], item["port"])

              return {"normalized_bastion_csv": write_csv(hosts.values())}
        code_language: python3
        desc: 清洗堡垒机 CSV，过滤非法 IP，并按 IP 合并重复资源
        outputs:
          normalized_bastion_csv: {children: null, type: string}
        selected: false
        title: normalize_bastion_csv
        type: code
