identity:
  author: wangrundong
  name: zabbix_export_csv
  label:
    en_US: Export Zabbix CSV
    zh_Hans: 导出 Zabbix CSV
description:
  human:
    en_US: Export Zabbix hosts and host groups as two downloadable CSV files.
    zh_Hans: 将 Zabbix 主机和主机群组导出为两个可下载的 CSV 文件。
  llm: Export Zabbix hosts and host groups as downloadable CSV files.
parameters:
  - name: zabbix_url
    type: string
    required: true
    form: llm
    label:
      en_US: Zabbix URL
      zh_Hans: Zabbix 地址
    human_description:
      en_US: Zabbix URL. /api_jsonrpc.php is appended automatically when missing.
      zh_Hans: Zabbix 地址，缺少 /api_jsonrpc.php 时会自动补全。
    llm_description: Zabbix server URL.
  - name: zabbix_user
    type: string
    required: true
    form: llm
    label:
      en_US: Zabbix user
      zh_Hans: Zabbix 用户名
    human_description:
      en_US: Zabbix login username.
      zh_Hans: Zabbix 登录用户名。
    llm_description: Zabbix login username.
  - name: zabbix_password
    type: string
    required: true
    form: llm
    label:
      en_US: Zabbix password
      zh_Hans: Zabbix 密码
    human_description:
      en_US: Zabbix login password.
      zh_Hans: Zabbix 登录密码。
    llm_description: Zabbix login password. Never expose it in output.
extra:
  python:
    source: tools/zabbix_export_csv.py

