          variable: slice_size
      height: 214
      id: '1820000000001'
      position: {x: 80, y: 280}
      positionAbsolute: {x: 80, y: 280}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        code: |
          import csv
          import io
          import json
          import ipaddress

          MAX_KNOWLEDGE_ROWS = 160


          def clean(value):
              return "" if value is None else str(value).strip()


          def parse_csv(text):
              text = clean(text).lstrip("\ufeff")
              if not text:
                  return []
              reader = csv.DictReader(io.StringIO(text))
              reader.fieldnames = [clean(name) for name in (reader.fieldnames or [])]
              return [{clean(key): clean(value) for key, value in row.items() if key} for row in reader]


          def to_int(value, default):
              try:
                  return int(clean(value))
              except Exception:
                  return default


          def normalize_ip(value):
              try:
                  return str(ipaddress.IPv4Address(clean(value)))
              except Exception:
                  return clean(value)


          def main(bastion_only_csv: str, hostgroup_knowledge_csv: str, slice_index: str = "0", slice_size: str = "50") -> dict:
              all_hosts = parse_csv(bastion_only_csv)
              knowledge = parse_csv(hostgroup_knowledge_csv)[:MAX_KNOWLEDGE_ROWS]
              index = max(0, to_int(slice_index, 0))
              size = max(1, min(100, to_int(slice_size, 50)))
              total = len(all_hosts)
              start = index * size
              end = min(start + size, total)
              selected = all_hosts[start:end]

              hosts = []
              for row in selected:
                  ip = normalize_ip(row.get("ip"))
                  hosts.append({
                      "ip": ip,
                      "name": clean(row.get("bastion_name") or row.get("name")),
                      "os_type": clean(row.get("bastion_os_type") or row.get("os_type")),
                      "protocol": clean(row.get("bastion_protocol") or row.get("protocol")),
                      "port": clean(row.get("bastion_port") or row.get("port")),
                      "department": clean(row.get("bastion_department") or row.get("department")),
                      "resource_tag": clean(row.get("bastion_resource_tag") or row.get("resource_tag")),
                  })

              next_index = index + 1 if end < total else ""
              if total == 0:
                  summary = "本次没有可处理主机，共 0 条"
              elif start >= total:
                  summary = "本次处理范围超出数据，共 %s 条，请调小 slice_index" % total
              elif next_index == "":
                  summary = "本次处理第 %s-%s 条，共 %s 条，已处理到最后一片" % (start + 1, end, total)
              else:
                  summary = "本次处理第 %s-%s 条，共 %s 条，后续可继续使用 slice_index=%s" % (start + 1, end, total, next_index)

              return {
                  "hosts_json": json.dumps(hosts, ensure_ascii=False, separators=(",", ":")),
                  "knowledge_json": json.dumps(knowledge, ensure_ascii=False, separators=(",", ":")),
                  "run_summary": summary,
              }
        code_language: python3
        desc: 清洗输入并按 slice_index/slice_size 截取本次要推荐的主机
        outputs:
          hosts_json: {children: null, type: string}
          knowledge_json: {children: null, type: string}
          run_summary: {children: null, type: string}
        selected: false
        title: prepare_slice
        type: code
        variables:
        - value_selector: ['1820000000001', bastion_only_csv]
          variable: bastion_only_csv
        - value_selector: ['1820000000001', hostgroup_knowledge_csv]
          variable: hostgroup_knowledge_csv
        - value_selector: ['1820000000001', slice_index]
          variable: slice_index
        - value_selector: ['1820000000001', slice_size]
          variable: slice_size
