    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 基于知识表给待导入主机推荐主机群组
        model:
          completion_params:
            temperature: 0.1
          mode: chat
          name: deepseek-v4-flash
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - id: 1820000000003-system
          role: system
          text: |
            你是 Zabbix 主机群组推荐助手。
            你会收到两段 JSON：待导入主机列表 hosts，以及主机群组知识表 knowledge。
            请根据主机名称、IP、系统类型、部门、资源标签、协议端口，以及 knowledge 中的 group_name、group_semantic、host_name_samples、host_ip_samples、template_samples，给每台主机推荐 Zabbix 主机群组。

            只输出 JSON 数组，不要输出 Markdown，不要输出代码块，不要解释。
            数组中每个对象必须只有以下字段：
            ip,name,primary_group,suggested_groups,confidence,need_manual_review

            字段要求：
            - primary_group 必须来自 suggested_groups 中最核心的一个。
            - suggested_groups 是数组，元素必须尽量使用 knowledge 里已有的 group_name。
            - confidence 只能是 高、中、低。
            - need_manual_review 只能是 是、否。
            - 不要输出 reason，不要输出 理由，不要输出长文本解释。
            - 如果很确定，confidence=高 且 need_manual_review=否。
            - 如果有一定依据但不够确定，confidence=中 且 need_manual_review=是。
            - 如果信息不足或多个候选组都像，confidence=低 且 need_manual_review=是。
        - id: 1820000000003-user
          role: user
          text: |
            hosts:
            {{#1820000000002.hosts_json#}}

            knowledge:
            {{#1820000000002.knowledge_json#}}
        selected: false
        title: recommend_hostgroups
        type: llm
        vision:
          enabled: false
      height: 98
      id: '1820000000003'
      position: {x: 680, y: 280}
      positionAbsolute: {x: 680, y: 280}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        code: |
          import csv
          import io
          import json
          import re

          FIELDS = [
              "ip", "name", "primary_group", "suggested_groups",
              "confidence", "need_manual_review",
          ]
          CONFIDENCE_VALUES = {"高", "中", "低"}
          REVIEW_VALUES = {"是", "否"}


          def clean(value):
              return "" if value is None else str(value).strip()


          def load_json(text, default):
              text = clean(text)
              if not text:
                  return default
              text = re.sub(r"^```(?:json)?\s*", "", text)
              text = re.sub(r"\s*```$", "", text)
              try:
                  return json.loads(text)
              except Exception:
                  return default


          def parse_groups(value):
              if isinstance(value, list):
                  raw = value
              else:
                  raw = re.split(r"[;；,，]", clean(value))
              groups = []
              for item in raw:
                  item = clean(item)
                  if item and item not in groups:
                      groups.append(item)
              return groups


          def write_csv(rows):
              output = io.StringIO(newline="")
              writer = csv.DictWriter(output, fieldnames=FIELDS, extrasaction="ignore")
              writer.writeheader()
              writer.writerows(rows)
              return output.getvalue()


          def main(hosts_json: str, llm_text: str) -> dict:
              hosts = load_json(hosts_json, [])
              llm_rows = load_json(llm_text, [])
              rows_by_ip = {}
              if isinstance(llm_rows, list):
                  for item in llm_rows:
                      if isinstance(item, dict):
                          ip = clean(item.get("ip"))
                          if ip:
                              rows_by_ip[ip] = item

              output_rows = []
              for host in hosts if isinstance(hosts, list) else []:
                  if not isinstance(host, dict):
                      continue
                  ip = clean(host.get("ip"))
                  name = clean(host.get("name"))
                  item = rows_by_ip.get(ip, {})
                  groups = parse_groups(item.get("suggested_groups"))
                  primary = clean(item.get("primary_group"))
                  if primary and primary not in groups:
                      groups.insert(0, primary)
                  if not primary and groups:
                      primary = groups[0]
                  confidence = clean(item.get("confidence"))
                  if confidence not in CONFIDENCE_VALUES:
                      confidence = "低"
                  review = clean(item.get("need_manual_review"))
                  if review not in REVIEW_VALUES:
                      review = "是"
                  if confidence == "低":
                      review = "是"
                  output_rows.append({
                      "ip": ip,
                      "name": name,
                      "primary_group": primary,
                      "suggested_groups": ";".join(groups),
                      "confidence": confidence,
                      "need_manual_review": review,
                  })

              return {"recommended_hostgroups_csv": write_csv(output_rows)}
        code_language: python3
        desc: 校验 LLM 输出并整理为固定字段 CSV，不保留理由
        outputs:
          recommended_hostgroups_csv: {children: null, type: string}
        selected: false
        title: build_recommend_csv
        type: code
        variables:
        - value_selector: ['1820000000002', hosts_json]
          variable: hosts_json
        - value_selector: ['1820000000003', text]
          variable: llm_text
      height: 98
      id: '1820000000004'
      position: {x: 980, y: 280}
      positionAbsolute: {x: 980, y: 280}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
